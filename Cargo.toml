[package]
name = "breaky"
version = "0.1.0"
edition = "2021"
description = "Browser engine in Rust"
license = "MIT"

[workspace]
resolver = "2"
members = [
    "crates/breaky-html",
    "crates/breaky-css",
    "crates/breaky-style",
]

[dependencies]
breaky-html = { path = "crates/breaky-html" }
breaky-css = { path = "crates/breaky-css" }
breaky-style = { path = "crates/breaky-style" }

[profile.release]
strip = true
lto = true
