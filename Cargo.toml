[package]
name = "breaky"
version = "0.1.0"
edition = "2021"
description = "Browser engine in Rust"
license = "MIT"

[workspace]
resolver = "2"
members = [
    "crates/breaky-html",
    "crates/breaky-css",
    "crates/breaky-style",
    "crates/breaky-layout",
    "crates/breaky-render",
    "crates/breaky-font",
    "crates/breaky-net",
]

[dependencies]
breaky-html = { path = "crates/breaky-html" }
breaky-css = { path = "crates/breaky-css" }
breaky-style = { path = "crates/breaky-style" }
breaky-layout = { path = "crates/breaky-layout" }
breaky-render = { path = "crates/breaky-render" }
breaky-font = { path = "crates/breaky-font" }
breaky-net = { path = "crates/breaky-net" }

[profile.release]
strip = true
lto = true
