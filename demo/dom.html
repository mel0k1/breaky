<!DOCTYPE html>
<html>
<head>
<title>DOM bindings</title>
</head>
<body>
<h1>DOM bindings</h1>
<div id="card">static placeholder</div>
<script>
var card = document.getElementById("card");
card.innerHTML = "mutated by <b>QuickJS</b>: getElementById, innerHTML, style";
card.style.background = "#fff2dd";
card.style["border-color"] = "#c98a2d";
var extra = document.createElement("p");
extra.textContent = "built with createElement + appendChild";
document.body.appendChild(extra);
var found = document.querySelector("#card b");
found.style.color = "#7a1fa2";
console.log("found", found.tagName, found.textContent.length);
</script>
</body>
</html>
