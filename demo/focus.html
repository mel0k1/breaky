<html><body>
<button id="a" class="f">alpha</button>
<button id="b" class="f" tabindex="2">beta</button>
<button id="c" class="f">gamma</button>
<div id="s">idle</div>
<script>
var s = document.getElementById('s');
document.addEventListener('focusin', function (ev) {
  var id = ev.target.getAttribute('id');
  s.textContent = 'focused: ' + id;
  ev.target.setAttribute('class', 'f2');
});
document.addEventListener('focusout', function (ev) {
  ev.target.setAttribute('class', 'f');
});
</script>
</body></html>
