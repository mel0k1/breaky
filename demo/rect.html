<!doctype html>
<html>
<head>
<link rel="stylesheet" href="rect.css">
</head>
<body>
<div id="box">rect target</div>
<div id="out">move pointer over the box</div>
<script>
var box = document.getElementById('box');
var out = document.getElementById('out');
box.addEventListener('mouseover', function () {
  var r = box.getBoundingClientRect();
  out.textContent = 'x:' + Math.round(r.x) + ' y:' + Math.round(r.y) + ' w:' + Math.round(r.width) + ' h:' + Math.round(r.height);
});
</script>
</body>
</html>
