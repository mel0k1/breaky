<!DOCTYPE html>
<html>
<head>
<title>events</title>
</head>
<body>
<h1>events</h1>
<p id="msg">waiting for click</p>
<div id="panel">
  <button id="btn">go</button>
</div>
<script>
var msg = document.getElementById("msg");
document.getElementById("btn").addEventListener("click", function (ev) {
  this.textContent = "clicked at " + Math.round(ev.clientX) + "," + Math.round(ev.clientY);
});
document.getElementById("panel").addEventListener("click", function (ev) {
  msg.textContent = "panel saw " + ev.type + " on " + ev.target.tagName + " at " + Math.round(ev.clientX) + "," + Math.round(ev.clientY);
  msg.style.color = "#aa2222";
});
</script>
</body>
</html>
